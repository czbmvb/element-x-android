name: GSPCOMS Chat APK

# Build manual del APK de GSPCOMS Chat (fork de Element X).
# Flavor gplay + buildType release, firmado con el KEYSTORE RELEASE propio de GSPCOMS
# (secrets ANDROID_SIGNING_KEY/ANDROID_ALIAS/ANDROID_KEY_STORE_PASSWORD/ANDROID_KEY_PASSWORD).
# Instalable por sideload. En local (sin esos env) el release cae a debug.

on:
  workflow_dispatch:
  push:
    branches: [gspcoms]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

jobs:
  build:
    name: Build GSPCOMS Chat APK (fdroid/release)
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Decode release keystore
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: echo "$ANDROID_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/gspcoms-release.keystore"

      - name: Assemble gplay release APK (firmado release)
        env:
          GSPCOMS_KEYSTORE_FILE: ${{ runner.temp }}/gspcoms-release.keystore
          GSPCOMS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          GSPCOMS_KEY_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          GSPCOMS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGplayRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gspcoms-chat-apk
          path: app/build/outputs/apk/gplay/release/*.apk
          if-no-files-found: error
