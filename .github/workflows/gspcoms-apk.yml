name: GSPCOMS Chat APK

# Build manual del APK de GSPCOMS Chat (fork de Element X).
# Flavor fdroid (sin Google/Firebase) + buildType release (firmado con keystore debug del repo,
# instalable por sideload). Sin analytics/maps (config FOSS de GSPCOMS).

on:
  workflow_dispatch:
  push:
    branches: [gspcoms]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

jobs:
  build:
    name: Build GSPCOMS Chat APK (fdroid/release)
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Assemble fdroid release APK
        run: ./gradlew :app:assembleFdroidRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gspcoms-chat-apk
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
